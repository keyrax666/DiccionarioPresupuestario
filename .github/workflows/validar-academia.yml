name: Validar academia

on:
  push:
    paths:
      - "index.html"
      - "ruta-consultas-sicoin.html"
      - "ruta-guatecompras.html"
      - "sw.js"
      - "actualidad.js"
      - "tests/ruta-sicoin.test.cjs"
      - "tests/ruta-guatecompras-autoevaluacion.test.cjs"
      - ".github/workflows/validar-academia.yml"
  pull_request:
    paths:
      - "index.html"
      - "ruta-consultas-sicoin.html"
      - "ruta-guatecompras.html"
      - "sw.js"
      - "actualidad.js"
      - "tests/ruta-sicoin.test.cjs"
      - "tests/ruta-guatecompras-autoevaluacion.test.cjs"
      - ".github/workflows/validar-academia.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Comprobar sintaxis de scripts
        run: node --check actualidad.js && node --check sw.js
      - name: Probar ruta educativa GUATECOMPRAS
        run: node --test tests/ruta-guatecompras-autoevaluacion.test.cjs
      - name: Probar navegación, ruta y caché offline SICOIN
        run: node --test tests/ruta-sicoin.test.cjs
