<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Diccionario Presupuestario Hospitalario</title><style>body{font-family:system-ui;margin:0;background:#f4f7fb;color:#15263c}header{background:#102b52;color:white;padding:38px 7%}main{max-width:1100px;margin:30px auto;padding:0 18px}input,select{padding:14px;border-radius:10px;border:1px solid #b5c5d6;font-size:16px;width:100%;box-sizing:border-box;margin:6px 0}section{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin-top:20px}article{background:white;border:1px solid #dce4ef;border-radius:14px;padding:20px;box-shadow:0 3px 12px #142e4410}small{color:#32618f}h2{margin-top:0}footer{padding:25px;text-align:center;color:#52667c}</style></head><body><header><h1>Diccionario Presupuestario Hospitalario</h1><p>Conceptos de uso común en las unidades ejecutoras de salud pública de Guatemala · Recurso educativo independiente</p></header><main><input id="search" placeholder="Buscar término, definición o ejemplo" aria-label="Buscar términos"><select id="category" aria-label="Filtrar categoría"><option value="">Todas las categorías</option></select><p id="count"></p><section id="cards"></section></main><footer>Material didáctico no oficial. Consulte normativa vigente de MINFIN, MSPAS y SEGEPLAN.</footer><script>const raw=`Producto|Gestión por resultados|Bien o servicio que una institución pública entrega a la población.|Atenciones de salud prestadas.\nSubproducto|Gestión por resultados|Entrega específica que contribuye a un producto institucional.|Consultas de control prenatal.\nResultado|Gestión por resultados|Cambio esperado en una condición de la población por efecto de intervenciones.|Mejorar cobertura de atención.\nMeta física|Gestión por resultados|Cantidad programada o ejecutada de bienes o servicios.|Número de consultas realizadas.\nIndicador|Gestión por resultados|Medida utilizada para monitorear productos o resultados.|Porcentaje de cobertura.\nInsumo|Gestión por resultados|Recurso empleado para producir bienes o prestar servicios.|Guantes y material médico.\nPrograma|Estructura programática|Categoría que organiza recursos para objetivos institucionales.|Programa de servicios de salud.\nSubprograma|Estructura programática|Desagregación de un programa cuando corresponde.|Subprograma específico de atención.\nProyecto|Estructura programática|Conjunto de acciones de inversión con objetivo y plazo definidos.|Construcción o ampliación de infraestructura.\nActividad|Estructura programática|Operaciones continuas que contribuyen a producir bienes o servicios.|Prestación de atención hospitalaria.\nObra|Estructura programática|Componente de ejecución física de un proyecto de inversión.|Construcción de un edificio.\nPartida presupuestaria|Estructura programática|Combinación de clasificadores que identifica una asignación de gasto.|Partida para adquirir suministros.\nRenglón presupuestario|Clasificadores|Código que identifica la naturaleza del gasto.|Renglón para materiales o servicios.\nGrupo 000|Clasificadores|Clasificación de servicios personales.|Remuneraciones de personal.\nGrupo 100|Clasificadores|Clasificación de servicios no personales.|Servicios contratados.\nGrupo 200|Clasificadores|Clasificación de materiales y suministros.|Compra de materiales médicos.\nGrupo 300|Clasificadores|Clasificación de propiedad, planta, equipo e intangibles.|Adquisición de equipo.\nGrupo 400|Clasificadores|Clasificación de transferencias corrientes.|Transferencias según normativa.\nGrupo 900|Clasificadores|Clasificación de asignaciones globales.|Previsiones según clasificador vigente.\nFuente de financiamiento|Clasificadores|Código que identifica origen de recursos.|Recursos provenientes de fuente autorizada.\nOrganismo financiador|Clasificadores|Identifica el organismo asociado al financiamiento cuando aplica.|Financiamiento externo.\nCorrelativo|Clasificadores|Código complementario para distinguir asignaciones según estructura aplicable.|Identificación detallada de financiamiento.\nPresupuesto aprobado|Presupuesto|Asignaciones autorizadas al inicio del ejercicio fiscal.|Monto aprobado para la unidad ejecutora.\nPresupuesto vigente|Presupuesto|Presupuesto aprobado ajustado por modificaciones autorizadas.|Monto disponible tras ampliaciones.\nAsignación presupuestaria|Presupuesto|Monto autorizado para una partida o estructura.|Crédito en un renglón determinado.\nSaldo presupuestario|Presupuesto|Diferencia de los montos presupuestarios según momento y reporte.|Saldo consultado antes de registrar gastos.\nModificación presupuestaria|Presupuesto|Cambio autorizado a asignaciones durante el ejercicio.|Traslado entre renglones permitido.\nTransferencia presupuestaria|Presupuesto|Reasignación autorizada entre partidas según reglas vigentes.|Mover crédito entre partidas.\nAmpliación presupuestaria|Presupuesto|Incremento autorizado del presupuesto.|Recursos adicionales para atención.\nDisminución presupuestaria|Presupuesto|Reducción autorizada de asignaciones.|Ajuste de créditos.\nEjecución presupuestaria|Ejecución|Registro y seguimiento de operaciones que utilizan créditos aprobados.|Seguimiento mensual del gasto.\nPrecompromiso|Ejecución|Registro previo de reserva o afectación según proceso aplicable.|Reserva previa para una adquisición.\nCompromiso|Ejecución|Etapa que registra una obligación contractual o decisión de gasto según normativa.|Compromiso por orden de compra.\nDevengado|Ejecución|Etapa que reconoce una obligación de pago conforme documentación válida.|Recepción conforme de bienes.\nPagado|Ejecución|Etapa que refleja pago realizado de una obligación.|Pago autorizado al proveedor.\nCUR|Sistemas y documentos|Comprobante Único de Registro utilizado en operaciones del sistema financiero.|CUR de gasto.\nSICOIN|Sistemas y documentos|Sistema de Contabilidad Integrada utilizado en la gestión financiera pública.|Consulta de ejecución.\nSIGES|Sistemas y documentos|Sistema de Gestión utilizado en procesos administrativos y financieros.|Registro de adquisiciones.\nMINFIN|Instituciones|Ministerio de Finanzas Públicas de Guatemala.|Emite lineamientos presupuestarios.\nMSPAS|Instituciones|Ministerio de Salud Pública y Asistencia Social.|Rectoría sectorial en salud.\nSEGEPLAN|Instituciones|Secretaría de Planificación y Programación de la Presidencia.|Lineamientos de planificación.\nUnidad ejecutora|Organización|Unidad responsable de gestionar recursos y ejecutar presupuesto según estructura oficial.|Hospital con código de unidad.\nPOA|Planificación|Plan Operativo Anual que organiza objetivos, metas y acciones del año.|Programación anual hospitalaria.\nPOM|Planificación|Plan Operativo Multianual que orienta metas y acciones de varios años.|Proyección plurianual de servicios.\nPEI|Planificación|Plan Estratégico Institucional.|Orientación estratégica del sector.\nProgramación financiera|Planificación|Planificación temporal de recursos y pagos.|Calendario de ejecución.\nCuota financiera|Ejecución|Límite o programación financiera autorizada según modalidad aplicable.|Cuota para compromisos.\nDisponibilidad presupuestaria|Control|Verificación de crédito suficiente conforme momento presupuestario.|Confirmar recursos antes de comprar.\nConciliación|Control|Comparación de registros para identificar y resolver diferencias.|Comparar ejecución con controles.\nLiquidación|Control|Cierre o justificación documentada de recursos u operaciones.|Liquidación de fondo.\nInventario|Control|Registro y control de existencias o bienes según su naturaleza.|Control de materiales en bodega.\nAlmacén|Organización|Área responsable del control y resguardo de suministros.|Recepción de insumos.\nRequisición|Sistemas y documentos|Solicitud interna documentada de bienes o servicios.|Solicitud de papelería.\nOrden de compra|Sistemas y documentos|Documento formal de adquisición emitido conforme proceso.|Compra de reactivos.\nFactura|Sistemas y documentos|Documento de respaldo de una adquisición conforme reglas aplicables.|Factura del proveedor.\nActa de recepción|Sistemas y documentos|Documento que acredita recepción conforme cuando procede.|Recepción de equipo.\nCotización|Adquisiciones|Procedimiento o solicitud de precios, según contexto y normativa.|Proceso de compra autorizado.\nLicitación|Adquisiciones|Procedimiento competitivo de contratación conforme umbrales y reglas.|Compra institucional de gran monto.\nGUATECOMPRAS|Sistemas y documentos|Sistema de información de contrataciones del Estado.|Publicación de procesos.\nPAC|Planificación|Plan Anual de Compras conforme regulación aplicable.|Programación de adquisiciones.\nCierre fiscal|Presupuesto|Operaciones y controles al finalizar ejercicio fiscal.|Revisión de saldos al cierre.\nEjercicio fiscal|Presupuesto|Periodo anual al que corresponde el presupuesto público.|Ejecución del año calendario.\nRendición de cuentas|Control|Obligación de informar y justificar uso de recursos públicos.|Reportes institucionales de gasto.\nControl interno|Control|Conjunto de políticas y procedimientos para administrar riesgos.|Separación de funciones.\nContraloría General de Cuentas|Instituciones|Entidad fiscalizadora superior del Estado.|Auditoría de operaciones.\nNOG|Adquisiciones|Número de Operación GUATECOMPRAS para identificar procesos.|Consultar publicación de compra.\nNPG|Adquisiciones|Número de Publicación GUATECOMPRAS según tipo de registro.|Identificar publicación.\nRenglón 011|Clasificadores|Personal permanente según clasificador vigente.|Remuneración de plazas permanentes.\nRenglón 029|Clasificadores|Otras remuneraciones de personal temporal, según clasificador.|Contratación conforme régimen aplicable.\nGrupo 400|Clasificadores|Transferencias corrientes según clasificador.|Transferencia autorizada.\nReporte de ejecución|Control|Documento o consulta con avances presupuestarios.|Resumen mensual por renglón.`;const data=[...new Map(raw.split('\n').map(x=>x.split('|')).filter(x=>x.length===4).map(x=>[x[0],x])).values()];const cats=[...new Set(data.map(x=>x[1]))].sort();let s=document.getElementById('category');cats.forEach(x=>{let o=document.createElement('option');o.value=x;o.textContent=x;s.append(o)});function render(){let q=document.getElementById('search').value.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''),c=s.value;let rows=data.filter(x=>(!c||x[1]===c)&&x.join(' ').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').includes(q));document.getElementById('count').textContent=rows.length+' de '+data.length+' términos';document.getElementById('cards').replaceChildren(...rows.map(x=>{let a=document.createElement('article');let h=document.createElement('h2');h.textContent=x[0];let k=document.createElement('small');k.textContent=x[1];let p=document.createElement('p');p.textContent=x[2];let e=document.createElement('p');e.textContent='Ejemplo: '+x[3];a.append(h,k,p,e);return a}))}document.getElementById('search').addEventListener('input',render);s.addEventListener('change',render);render();</script></body></html>
